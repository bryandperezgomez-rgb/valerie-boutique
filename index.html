<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valerie Boutique – Cisneros</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* Estilos base, variables y animaciones originales */
    :root { --rose: #C9647A; --rose-dk: #8A3F52; --cream: #FAF7F4; --ink: #1E1A1C; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); margin: 0; color: var(--ink); }
    
    /* FAB DUAL (WhatsApp y Facebook) */
    .fab-container { position: fixed; bottom: 30px; right: 30px; display: flex; flex-direction: column; gap: 15px; z-index: 2000; }
    .fab { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 28px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: 0.3s; text-decoration: none; }
    .fab.wa { background: #25D366; }
    .fab.fb { background: #1877F2; }
    .fab:hover { transform: scale(1.1); }

    /* Estructura original restaurada */
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; padding: 40px; }
    .product-card { background: white; border-radius: 20px; padding: 20px; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
    .product-card img { width: 100%; height: 350px; object-fit: cover; border-radius: 15px; }
    .fade-up { opacity: 0; transform: translateY(30px); transition: 0.6s ease-out; }
    .fade-up.visible { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

  <div class="fab-container">
    <a href="https://wa.me/573011044050" class="fab wa" target="_blank">📱</a>
    <a href="https://facebook.com/TuPagina" class="fab fb" target="_blank">f</a>
  </div>

  <main class="products-grid">
    <div class="product-card fade-up">
      <img src="imagenes/Imagen1.png" alt="Producto">
      <h3>Pijama Satín Premium</h3>
    </div>
    <div class="product-card fade-up">
      <img src="imagenes/Imagen2.png" alt="Producto">
      <h3>Pijama Algodón Soft</h3>
    </div>
    <div class="product-card fade-up">
      <img src="imagenes/Imagen3.png" alt="Producto">
      <h3>Pijama Relax</h3>
    </div>
    <div class="product-card fade-up">
      <img src="imagenes/Imagen4.jpg" alt="Producto">
      <h3>Pijama Velvet</h3>
    </div>
  </main>

  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.1 });
    document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
  </script>
</body>
</html>
