<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Valerie Boutique - Cisneros</title>
  <style>
    /* Estilos para el diseño */
    .hero-portada { text-align: center; padding: 50px; }
    .hero-portada img { width: 200px; height: 200px; border-radius: 50%; object-fit: cover; }
    .productos-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
    .tarjeta-producto { border: 1px solid #ddd; padding: 15px; text-align: center; }
    .tarjeta-producto img { width: 100%; height: 250px; object-fit: cover; }
  </style>
</head>
<body>

  <section class="hero-portada">
    <img src="imagenes/image_b7035f.png" alt="Portada Valerie Boutique">
    <h1>Valerie Boutique</h1>
  </section>

  <section class="productos-container">
    
    <div class="tarjeta-producto">
      <img src="imagenes/Imagen1.png" alt="Pijama">
      <h3>Pijama Satín</h3>
    </div>

    <div class="tarjeta-producto">
      <img src="imagenes/Imagen2.png" alt="Pijama">
      <h3>Pijama Algodón</h3>
    </div>

    <div class="tarjeta-producto">
      <img src="imagenes/Imagen3.png" alt="Pijama">
      <h3>Pijama Relax</h3>
    </div>

    <div class="tarjeta-producto">
      <img src="imagenes/Imagen4.jpg" alt="Pijama">
      <h3>Pijama Velvet</h3>
    </div>

  </section>

</body>
</html>
