<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valerie Boutique – Cisneros</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* Estilos recuperados del diseño original */
    :root { --rose: #C9647A; --rose-dk: #8A3F52; --cream: #FAF7F4; --ink: #1E1A1C; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); margin: 0; color: var(--ink); }
    
    /* Banner Promo Pulsante */
    .promo-banner { background: var(--rose-dk); color: white; text-align: center; padding: 15px; font-weight: bold; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } }
    
    /* Navegación */
    .nav { padding: 20px; display: flex; align-items: center; justify-content: space-between; }
    .nav-logo img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
    
    /* Grid de Productos */
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; padding: 40px; }
    .product-card { background: white; border-radius: 20px; padding: 20px; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
    .product-card:hover { transform: translateY(-10px); }
    .product-card img { width: 100%; height: 350px; object-fit: cover; border-radius: 15px; }
    
    /* Animación de entrada */
    .fade-up { opacity: 0; transform: translateY(30px); transition: 0.6s ease-out; }
    .fade-up.visible { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>

  <div class="promo-banner">✨ ¡PIJAMAS EXCLUSIVAS DESDE $11.700 COP! ✨</div>

  <nav class="nav">
    <a href="#"><img src="imagenes/image_b7035f.png" alt="Logo"></a>
  </nav>

  <main class="products-grid">
    <div class="product-card fade-up">
      <img src="imagenes/Imagen1.png" alt="Pijama">
      <h3>Pijama Satín Premium</h3>
      <p>$11.700</p>
    </div>

    <div class="product-card fade-up">
      <img src="imagenes/Imagen2.png" alt="Pijama">
      <h3>Pijama Algodón</h3>
      <p>$14.500</p>
    </div>

    <div class="product-card fade-up">
      <img src="imagenes/Imagen3.png" alt="Pijama">
      <h3>Pijama Relax Verano</h3>
      <p>$18.900</p>
    </div>

    <div class="product-card fade-up">
      <img src="imagenes/Imagen4.jpg" alt="Pijama">
      <h3>Pijama Velvet</h3>
      <p>$22.000</p>
    </div>
  </main>

  <script>
    // Recuperamos el observador de scroll para el efecto fade-up
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.1 });
    document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
  </script>
</body>
</html>
